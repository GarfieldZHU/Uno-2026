<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" role="img" aria-labelledby="title desc">
  <title id="title">UNO 2026 card back</title>
  <desc id="desc">Midnight blue card back with a warm red UNO oval and gold trim.</desc>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#152a66"/>
      <stop offset=".54" stop-color="#263b80"/>
      <stop offset="1" stop-color="#0b173e"/>
    </linearGradient>
    <linearGradient id="oval" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff7352"/>
      <stop offset=".5" stop-color="#ec3c31"/>
      <stop offset="1" stop-color="#9c1738"/>
    </linearGradient>
    <pattern id="grain" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 9h18M9 0v18" stroke="#fff" stroke-opacity=".06" stroke-width="1"/>
      <circle cx="3" cy="4" r="1" fill="#fff" fill-opacity=".07"/>
      <circle cx="14" cy="15" r="1" fill="#000" fill-opacity=".1"/>
    </pattern>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="11" stdDeviation="8" flood-color="#07102b" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="392" height="552" rx="42" fill="#f8f1d2" filter="url(#shadow)"/>
  <rect x="14" y="14" width="372" height="532" rx="34" fill="url(#shell)"/>
  <rect x="23" y="23" width="354" height="514" rx="27" fill="none" stroke="#e6c76a" stroke-opacity=".85" stroke-width="4"/>
  <rect x="29" y="29" width="342" height="502" rx="23" fill="none" stroke="#fff5c7" stroke-opacity=".22" stroke-width="2"/>
  <rect x="14" y="14" width="372" height="532" rx="34" fill="url(#grain)"/>
  <g transform="translate(200 280) rotate(-12)">
    <ellipse rx="131" ry="92" fill="#fff4d4" fill-opacity=".92"/>
    <ellipse rx="120" ry="82" fill="url(#oval)" stroke="#ffedbc" stroke-width="4"/>
    <path d="M-62 21c20-38 39-64 68-79-11 27-8 39 4 51 11 11 22 10 35 1-3 35-22 62-50 70 5-14 3-26-8-34-11-8-29-9-49-9Z" fill="#fff5db"/>
    <text x="0" y="10" text-anchor="middle" fill="#fff7df" font-family="Arial Black, Impact, sans-serif" font-size="38" font-style="italic" font-weight="900" letter-spacing="-3">UNO</text>
  </g>
  <path d="M65 103c56-44 117-54 268-5M334 457c-67 42-129 47-268-1" fill="none" stroke="#fff6ce" stroke-opacity=".14" stroke-width="3"/>
</svg>
